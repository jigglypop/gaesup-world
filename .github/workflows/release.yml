name: Verify, publish and deploy

on:
  push:
    branches: [main]
  # Work lands on main while the GitHub default branch is still master; check PRs to either.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# verify:full split into parallel jobs; check-harness fails if a verify gate is missing here.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: corepack pnpm run test:harness
      - run: corepack pnpm run typecheck
      - run: corepack pnpm run lint
      - run: corepack pnpm run check:layer1
      - run: corepack pnpm run check:entries
      - run: corepack pnpm run check:quality
      - run: corepack pnpm run audit:core
      - uses: actions/upload-artifact@v4
        with:
          name: source-inventory
          path: .artifacts/performance/inventory
          include-hidden-files: true

  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Transform cache keyed by toolchain; entries are content-hashed, so a stale cache only misses.
      - uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'jest.config.js', 'tsconfig*.json') }}
      - run: corepack pnpm exec jest --cacheDirectory=.jest-cache
      - run: corepack pnpm run test:memory:ci
      - run: corepack pnpm run test:asset-tools
      - run: corepack pnpm run test:minihome:service

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: corepack pnpm run build
      - run: corepack pnpm exec publint
      - run: corepack pnpm run test:package:built

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Builds the demo itself and checks the initial chunk surface.
      - run: corepack pnpm run test:demo

  release:
    needs: [checks, jest, package, demo]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global corepack npm@11.11.1
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm run build
      - id: publish
        run: node scripts/release/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_GAESUP_WORLD_1_0_31_TOKEN }}
      - if: steps.publish.outputs.released == 'true'
        run: node scripts/release/registry.mjs
      - if: steps.publish.outputs.released == 'true'
        run: node scripts/release/consumer.mjs
      - if: steps.publish.outputs.released == 'true'
        run: node scripts/release/build-demo.mjs
      - uses: actions/upload-artifact@v4
        if: steps.publish.outputs.released == 'true'
        with:
          name: release-manifest
          path: .artifacts/release/manifest.json
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v4
        if: steps.publish.outputs.released == 'true'
        with:
          path: demo-dist

  deploy:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: .artifacts/release
      - id: pages
        uses: actions/deploy-pages@v4
      - run: node scripts/release/live.mjs "$SITE_URL"
        env:
          SITE_URL: ${{ steps.pages.outputs.page_url }}
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: node scripts/release/browser.mjs "$SITE_URL"
        env:
          SITE_URL: ${{ steps.pages.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evidence
          path: .artifacts/release
          include-hidden-files: true
