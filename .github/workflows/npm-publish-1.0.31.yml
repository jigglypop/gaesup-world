name: Publish gaesup-world 1.0.31

on:
  push:
    branches: [codex/minihome-unity-preview]
    paths: [.github/workflows/npm-publish-1.0.31.yml]

permissions:
  contents: read

concurrency:
  group: npm-gaesup-world-1.0.31
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jigglypop/gaesup-world'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the authorized package and version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'gaesup-world' || pkg.version !== '1.0.31' || pkg.publishConfig.tag) {
            throw new Error('Unexpected publication target or custom tag.');
          }
          NODE
      - name: Install the locked dependencies and current npm CLI
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm rebuild esbuild
          npm install --global npm@12.0.2
      - name: Build and verify the public package
        run: |
          corepack pnpm run build
          corepack pnpm exec publint
          corepack pnpm run test:package:built
      - name: Pack the verified release
        run: |
          mkdir -p .tmp/npm-release
          npm pack --ignore-scripts --pack-destination .tmp/npm-release --json > .tmp/npm-release/receipt.json
          sha512sum .tmp/npm-release/gaesup-world-1.0.31.tgz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-release-1.0.31-${{ github.run_attempt }}
          path: .tmp/npm-release/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish gaesup-world 1.0.31
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GAESUP_WORLD_1_0_31_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish .tmp/npm-release/gaesup-world-1.0.31.tgz --ignore-scripts
      - name: Verify the published archive
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packed = JSON.parse(fs.readFileSync('.tmp/npm-release/receipt.json', 'utf8'));
          const local = Array.isArray(packed) ? packed[0] : packed['gaesup-world'];
          const response = await fetch('https://registry.npmjs.org/gaesup-world/1.0.31');
          if (!response.ok) throw new Error(`Registry verification returned HTTP ${response.status}.`);
          const remote = await response.json();
          fs.writeFileSync('.tmp/npm-release/registry.json', JSON.stringify(remote));
          if (remote.version !== '1.0.31' || remote.dist.integrity !== local.integrity) {
            throw new Error('Published package integrity mismatch.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Published gaesup-world@1.0.31\n\nIntegrity: ${local.integrity}\n`);
          NODE
