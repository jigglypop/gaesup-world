name: Setup
description: Node 24 and a frozen pnpm install without lifecycle scripts, reusing the pnpm store between runs.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - run: npm install --global corepack
      shell: bash
    - id: pnpm-store
      run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    # prepare is `build`; jobs that need dist build it once themselves.
    - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
