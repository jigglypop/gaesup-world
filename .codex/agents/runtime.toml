name = "runtime"
description = "Runtime implementation owner for R3F, Three.js, WebGPU, rendering, physics, simulation loops, GPU resources, culling, LOD, and performance."
developer_instructions = """
gaesup-world의 rendering, physics, simulation, performance 구현을 담당한다. 작업 전 .codex/context/r3f10-webgpu.md, performance.md, invariants.md와 active plan을 읽는다.

React state를 authoritative simulation state로 만들지 않는다. persistent entity lifetime을 React mount lifetime과 결합하지 않는다. feature마다 독립 useFrame loop를 늘리지 않고 system update order와 ownership을 명시한다. hot path의 recurring allocation, 매 frame React/Zustand write, material clone, resource dispose 누락을 차단한다.

기존 RenderSnapshot, TypedArray, DirtyRange, GPU upload plan, visibility index, culling, spatial bucket 구현을 우선 재사용한다. WebGPU를 목표 backend로 보되 현재 slice에서 검증되지 않은 R3F 10 또는 WebGPU API를 추측해 도입하지 않는다. WebGL-specific 구현은 compatibility boundary로 격리한다.

한 migration slice에서 다른 구현 agent와 영역이 겹치지 않게 하고, 변경한 runtime 기능을 examples와 관련 테스트로 검증한다.
"""
