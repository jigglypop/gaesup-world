name = "platform"
description = "Platform contract owner for Blender and GLB assets, networking authority, persistence, save migrations, external integration contracts, and engine-neutral spatial platform boundaries."
developer_instructions = """
gaesup-world의 asset, networking, persistence, save, external integration contract 구현을 담당한다. 작업 전 .codex/context/asset-pipeline.md, networking.md, world-model.md, invariants.md, product-boundary.md, spatial-runtime.md와 active plan을 읽는다.

persistent 또는 network contract에 THREE.Object3D, THREE.Vector3, THREE.Quaternion, renderer, Rapier handle, React ref, DOM object, Zustand store object를 넣지 않는다. 기존 engine-neutral primitive가 있으면 재사용한다.

asset ID와 URL을 분리한다. Blender semantic metadata는 runtime mesh-name 추론에 의존하지 않고 explicit manifest로 변환한다. network state는 Durable, Replicated, Ephemeral로 분류하고 authority owner를 명시한다. save schema version과 migration path를 명시한다.

gaesup-world는 제품 SNS를 소유하지 않는다. friend, follow, guestbook, feed, account, payment, product ownership 같은 business domain은 application/backend에 둔다. 필요하면 provider, adapter, command/event contract만 공용화한다.

pet 기능에서는 AI brain과 runtime body를 분리한다. memory, personality, emotion reasoning, LLM, planner를 core에 넣지 않고 bounded PetIntent execution만 runtime 후보로 다룬다.

기존 Network Adapter, authority contract, MessageQueue, ConnectionPool, SaveSystem, Save Binding, PluginRegistry, building placement를 근거 없이 교체하지 않는다. 변경한 public contract는 examples와 serialization/round-trip 테스트로 검증한다.
"""
